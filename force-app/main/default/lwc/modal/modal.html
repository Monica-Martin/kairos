<template>
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small custom-modal-scope">
            <div class="slds-modal__container custom-container">
                
                <header class="slds-modal__header custom-header">
                    <button class="slds-button slds-button_icon custom-close" title="Cerrar" onclick={handleClose}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate font-header">{title}</h2>
                </header>
                
                <div class="slds-modal__content slds-p-around_medium custom-content">
                    <slot></slot>
                </div>
                
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
